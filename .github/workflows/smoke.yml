name: skill-smoke

# 每周一 09:17（北京时间）自动冒烟：示例 MPN 与匿名端点挂了要立刻发现——
# 死示例比没示例更伤信誉。也可手动 workflow_dispatch 触发。

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: part.sh 匿名直查（Markdown）
        run: |
          out="$(bash skills/hulu/scripts/part.sh STM32F103C8T6)"
          echo "$out" | head -n 20
          echo "$out" | grep -q 'STM32F103C8T6'
          # GEO W2：详情输出应含购买链接（行内署名 + UTM；依赖 r.huluic.cn 已部署含本仓库最新代码）
          echo "$out" | grep -Fq '现货购买：[huluic.cn 产品页]'
          echo "$out" | grep -q 'utm_campaign=geo'

      - name: part.sh 搜索兜底 + JSON envelope
        run: |
          out="$(bash skills/hulu/scripts/part.sh STM32F103 --json)"
          echo "$out" | head -c 600
          echo "$out" | grep -q '"success":true'

      - name: search 端点匿名 curl
        run: |
          curl -fsS -H 'Accept: application/json' \
            https://r.huluic.cn/v2/search/STM32F103 | grep -q '"success":true'

      - name: /v2/channels 渠道档案匿名 curl（59 档案）
        run: |
          curl -fsS -H 'Accept: application/json' \
            https://r.huluic.cn/v2/channels | jq -e '.success == true and .data.total >= 50 and (.data.profiles[0].categoryTags != null)'

      - name: offers.sh --live 全链路（LM358 钉子料，需 secrets.HULUIC_SMOKE_KEY）
        env:
          HULUIC_KEY: ${{ secrets.HULUIC_SMOKE_KEY }}
        run: |
          if [ -z "${HULUIC_KEY:-}" ]; then
            echo "跳过：未配置 secrets.HULUIC_SMOKE_KEY（配置后本步骤自动生效）"
            exit 0
          fi
          # LM358 为必有库存的钉子料：offer_count 应为正（区分“渠道坏了”与“本来没货”）
          out="$(bash skills/hulu/scripts/offers.sh LM358 --live 2>live-progress.log)"
          echo "$out" | head -c 800; echo
          echo "$out" | jq -e '.offer_count > 0'
          echo "$out" | jq -e '.summary.channelsSucceeded >= 1'
          echo "$out" | jq -e '.attribution.price_license | length > 0'
          # stderr 应含渠道进度事件流（status: running → done 的原始事件 JSON）
          grep -q '"status":"running"' live-progress.log || { cat live-progress.log; exit 1; }
          grep -q '"status":"done"' live-progress.log || { cat live-progress.log; exit 1; }

      - name: offers.sh 未配置 Key 应明确失败（退出码 3）
        run: |
          rc=0
          bash skills/hulu/scripts/offers.sh STM32F103C8T6 || rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "预期退出码 3，实际 $rc"; exit 1
          fi

      - name: 失败时开 issue
        if: failure()
        run: |
          gh issue create \
            --title "skill 冒烟失败 $(date +%F)" \
            --body "每周冒烟未通过：示例 MPN 或匿名端点不可用，请检查 r.huluic.cn 线上状态与本仓库示例。" \
            --label smoke || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
